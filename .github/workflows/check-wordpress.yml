name: Check WordPress Posts

on:
  schedule:
    - cron: '0 */12 * * *'  # Run every 12h at midnight UTC
  workflow_dispatch:  # Allow manual triggering
  push:
    branches: [ main ]  # Run on each push to main

jobs:
  check-posts:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, json
        coverage: none

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-progress

    - name: Generate key
      run: php artisan key:generate

      - name: Configure Mail
      env:
        MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
      run: |
        sed -i "s|MAIL_MAILER=.*|MAIL_MAILER=\"smtp\"|" .env
        sed -i "s|MAIL_HOST=.*|MAIL_HOST=\"smtp.gmail.com\"|" .env
        sed -i "s|MAIL_PORT=.*|MAIL_PORT=\"587\"|" .env
        sed -i "s|MAIL_USERNAME=.*|MAIL_USERNAME=\"${MAIL_USERNAME}\"|" .env
        sed -i "s|MAIL_PASSWORD=.*|MAIL_PASSWORD=\"${MAIL_PASSWORD}\"|" .env
        sed -i "s|MAIL_ENCRYPTION=.*|MAIL_ENCRYPTION=\"tls\"|" .env
        echo "NOTIFICATION_EMAIL=\"${NOTIFICATION_EMAIL}\"" >> .env

    - name: Run WordPress check
      run: php artisan wordpress:check-posts